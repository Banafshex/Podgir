name: Android build
on:
  push:
    branches: ['arena/4b75fe71-podgir']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Report errors
        if: failure()
        run: |
          grep -E "(^e: |^\* What went wrong:|^> |^Execution failed|^Caused by:)" build-log.txt | tail -40 | while IFS= read -r line; do echo "::error::$line"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: podgir-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
