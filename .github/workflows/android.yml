name: Android build
on:
  push:
    branches: ['arena/4b75fe71-podgir']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Report errors
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import re, glob, xml.etree.ElementTree as ET
          data = open('build-log.txt', errors='replace').read().splitlines()
          lines = [line for line in data if re.search(r'(^e: |^\* What went wrong:|^> (?!Task)|^Execution failed|^Caused by:|^FAILURE:|^\* Try:)', line)]
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              for failure in ET.parse(path).getroot().iter('failure'):
                  lines.append((failure.get('message') or '') + ' ' + (failure.text or '')[:1000])
          print('::error::' + '%0A'.join(lines[:35]).replace('%', '%25').replace('%250A', '%0A'))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: podgir-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
